name: Dossiers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dossier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        run: pip install requests
      - name: Generer les dossiers
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python dossier.py
      - name: Commit
        run: |
          git config user.name  "Dossier bot"
          git config user.email "actions@github.com"
          git add -A fr/dossiers deep-dives dossier-cache.json dossier-data.json
          git diff --staged --quiet || git commit -m "Dossiers : generation"
          git push
