name: Radar des sorties

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6h UTC (8h à Montpellier)
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Lancer le radar
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python radar.py

      - name: Commit si changement
        run: |
          git config user.name  "Radar bot"
          git config user.email "actions@github.com"
          git add radar.html radar.json
          git diff --staged --quiet || git commit -m "Radar : mise à jour des sorties"
          git push
